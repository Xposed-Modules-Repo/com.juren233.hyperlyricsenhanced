name: Sync Upstream Release

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPO: juren233/HyperLyrics-Enhanced
      TARGET_REPO: Xposed-Modules-Repo/com.juren233.hyperlyricsenhanced
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync repository metadata
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/${SOURCE_REPO}/main/README.md" \
            --output README.md
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/${SOURCE_REPO}/main/assets/hyperlyrics-app-icon-rounded.png" \
            --create-dirs \
            --output assets/hyperlyrics-app-icon-rounded.png
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/${SOURCE_REPO}/main/LICENSE" \
            --output LICENSE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md LICENSE assets/hyperlyrics-app-icon-rounded.png

          if ! git diff --cached --quiet; then
            git commit \
              -m "chore: 同步上游展示资料" \
              -m "- 更新 README、开源协议与应用图标"
            git push origin HEAD:main
          fi

      - name: Sync latest stable release
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          release_json="$temp_dir/release.json"
          notes_file="$temp_dir/release-notes.md"

          gh api "repos/${SOURCE_REPO}/releases/latest" > "$release_json"

          asset_name="$(jq -r \
            '[.assets[] | select(.name | test("release.*\\.apk$"; "i"))][0].name // empty' \
            "$release_json")"
          asset_url="$(jq -r \
            '[.assets[] | select(.name | test("release.*\\.apk$"; "i"))][0].browser_download_url // empty' \
            "$release_json")"

          if [[ -z "$asset_name" || -z "$asset_url" ]]; then
            echo "No signed release APK found in the latest upstream release."
            exit 1
          fi

          apk_path="$temp_dir/$asset_name"
          curl --fail --location --silent --show-error "$asset_url" --output "$apk_path"

          aapt2="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt2 -print | sort -V | tail -n 1)"
          if [[ -z "$aapt2" ]]; then
            echo "aapt2 was not found on the runner."
            exit 1
          fi

          badging_file="$temp_dir/badging.txt"
          "$aapt2" dump badging "$apk_path" > "$badging_file"
          package_line="$(sed -n '1p' "$badging_file")"
          version_code="$(sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" <<< "$package_line")"
          version_name="$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$package_line")"
          version_name="${version_name// /_}"

          if [[ -z "$version_code" || -z "$version_name" ]]; then
            echo "Unable to read version information from $asset_name."
            exit 1
          fi

          target_tag="${version_code}-${version_name}"
          if gh release view "$target_tag" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo "Release $target_tag already exists; nothing to do."
            exit 0
          fi

          jq -r '.body // ""' "$release_json" > "$notes_file"
          gh release create "$target_tag" "$apk_path" \
            --repo "$TARGET_REPO" \
            --target main \
            --title "$version_name" \
            --notes-file "$notes_file"
